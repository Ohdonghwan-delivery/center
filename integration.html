<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고려 딜리버리 | 배민 실시간 연동</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#0b1220}body{margin:auto;max-width:850px;padding:18px}a{color:#93c5fd}.card{background:#152238;border:1px solid #30435e;border-radius:15px;padding:16px;margin:12px 0}button{background:#2563eb;color:white;border:0;padding:13px 17px;border-radius:10px;font-weight:700}small,.muted{color:#a8b7cf}#list{display:grid;gap:8px}.r{padding:12px;border-radius:10px;background:#1d304b}.r b{display:block}.nums{font-size:12px;color:#cbd5e1;margin-top:5px;overflow-wrap:anywhere}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats b{font-size:24px}#state{white-space:pre-wrap}</style></head><body><a href="./">← 기존 center 홈</a><h1>배민 실시간 관제</h1><div class="card"><h2>배민 비즈 로그인</h2><p class="muted">아래 버튼으로 배민 비즈를 열고 문자 인증을 진행하세요. 기사 현황 화면에서 북마크 수집기를 실행하면 이 화면에 데이터가 전달됩니다.</p><button id="open">배민 비즈 로그인 열기</button><p><small>중요: 이 탭을 닫지 마세요. 배민 탭과 이 탭이 함께 열려 있어야 합니다.</small></p><p id="state">연결 대기 중</p></div><div class="card stats"><div>기사 수<br><b id="count">—</b></div><div>최근 수신<br><b id="time">—</b></div></div><div class="card"><h2>기사 현황</h2><p class="muted">실적 열의 명칭은 배민 페이지의 표 헤더와 대조한 뒤 확정해야 합니다.</p><div id="list">데이터 수신 전</div></div><script src="./integration.js"></script></body></html>
